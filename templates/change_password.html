{% extends 'base.html' %}
{% load static %}

{% block title %}修改密码 - 跳蚤市场{% endblock %}

{% block content %}
<div class="password-container">
    <div class="password-card">
        <h2 class="password-title">🔑 修改密码</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="post" class="password-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="id_old_password">当前密码</label>
                <input type="password" id="id_old_password" name="old_password" class="form-control" 
                       placeholder="请输入当前密码" required>
            </div>
            
            <div class="form-group">
                <label for="id_new_password1">新密码</label>
                <input type="password" id="id_new_password1" name="new_password1" class="form-control" 
                       placeholder="请输入新密码（至少8位）" required>
                <small class="form-hint">💡 密码至少8位，包含字母和数字</small>
            </div>
            
            <div class="form-group">
                <label for="id_new_password2">确认新密码</label>
                <input type="password" id="id_new_password2" name="new_password2" class="form-control" 
                       placeholder="请再次输入新密码" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">✅ 修改密码</button>
                <a href="{% url 'auth_app:profile' %}" class="btn btn-secondary">↩️ 返回</a>
            </div>
        </form>
    </div>
</div>

<style>
    .password-container {
        max-width: 500px;
        margin: 40px auto;
        padding: 0 20px;
    }
    .password-card {
        background: white;
        border-radius: 20px;
        padding: 30px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .password-title {
        font-size: 24px;
        margin-bottom: 25px;
        color: #333;
        border-bottom: 1px solid #eee;
        padding-bottom: 15px;
        text-align: center;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
    }
    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.3s;
    }
    .form-control:focus {
        border-color: #667eea;
        outline: none;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    .form-hint {
        display: block;
        margin-top: 5px;
        color: #999;
        font-size: 12px;
    }
    .alert {
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 20px;
    }
    .alert-success {
        background: #e8f5e9;
        color: #2e7d32;
    }
    .alert-error {
        background: #ffebee;
        color: #c62828;
    }
    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 25px;
    }
    .btn {
        flex: 1;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        transition: all 0.3s;
    }
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }
    .btn-secondary {
        background: #f5f5f5;
        color: #666;
    }
    .btn-secondary:hover {
        background: #e0e0e0;
    }
    
    @media (max-width: 500px) {
        .password-card {
            padding: 20px;
        }
        .form-actions {
            flex-direction: column;
        }
    }
</style>
{% endblock %}
