{% extends 'base.html' %}
{% load static %}

{% block title %}下单成功 - 跳蚤市场{% endblock %}

{% block content %}
<div class="success-container">
    <div class="success-card">
        <div class="success-icon">✅</div>
        <h2>订单提交成功！</h2>
        <p>感谢您的信任，我们将尽快为您处理订单。</p>
        
        <div class="order-info">
            <div class="info-row">
                <span class="label">订单编号：</span>
                <span class="value">{{ id }}</span>
            </div>
            <div class="info-row">
                <span class="label">下单时间：</span>
                <span class="value">{{ time|date:"Y-m-d H:i:s" }}</span>
            </div>
            <div class="info-row">
                <span class="label">支付方式：</span>
                <span class="value">货到付款</span>
            </div>
        </div>
        
        <div class="tips">
            <p>💡 温馨提示：</p>
            <ul>
                <li>请保持电话畅通，配送员会提前联系您</li>
                <li>如有问题请联系客服：400-123-4567</li>
            </ul>
        </div>
        
        <div class="actions">
            <a href="{% url 'goods:index' %}" class="btn btn-primary">🏠 返回首页</a>
            <a href="{% url 'goods:orderinfo' %}" class="btn btn-secondary">📋 查看订单</a>
        </div>
    </div>
</div>

<style>
    .success-container {
        max-width: 500px;
        margin: 60px auto;
        padding: 0 20px;
    }
    .success-card {
        background: white;
        border-radius: 20px;
        padding: 40px;
        text-align: center;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .success-icon {
        font-size: 60px;
        margin-bottom: 20px;
    }
    .order-info {
        background: #f8f9fa;
        border-radius: 12px;
        padding: 20px;
        margin: 25px 0;
        text-align: left;
    }
    .info-row {
        margin-bottom: 10px;
    }
    .label {
        font-weight: bold;
        color: #333;
        margin-right: 10px;
    }
    .value {
        color: #666;
    }
    .tips {
        text-align: left;
        background: #fff8e1;
        border-radius: 12px;
        padding: 15px;
        margin: 20px 0;
    }
    .tips ul {
        margin: 10px 0 0 20px;
        color: #666;
    }
    .actions {
        display: flex;
        gap: 15px;
        margin-top: 25px;
    }
    .btn {
        flex: 1;
        padding: 12px;
        border-radius: 10px;
        text-decoration: none;
        font-weight: 500;
    }
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    .btn-secondary {
        background: #f5f5f5;
        color: #666;
    }
</style>
{% endblock %}
