{% extends 'base.html' %}
{% load static %}

{% block title %}添加收货地址 - 跳蚤市场{% endblock %}

{% block content %}
<div class="address-form-container">
    <div class="form-card">
        <h2 class="form-title">📝 添加收货地址</h2>
        
        <form method="post" class="address-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="receiver">收货人 <span class="required">*</span></label>
                <input type="text" id="receiver" name="receiver" class="form-control" 
                       placeholder="请输入收货人姓名" required>
            </div>
            
            <div class="form-group">
                <label for="phone">手机号码 <span class="required">*</span></label>
                <input type="tel" id="phone" name="phone" class="form-control" 
                       placeholder="请输入11位手机号码" required>
                <small class="form-hint">请输入11位有效手机号码</small>
            </div>
            
            <div class="form-row">
                <div class="form-group half">
                    <label for="province">省份 <span class="required">*</span></label>
                    <input type="text" id="province" name="province" class="form-control" 
                           placeholder="省份" required>
                </div>
                <div class="form-group half">
                    <label for="city">城市 <span class="required">*</span></label>
                    <input type="text" id="city" name="city" class="form-control" 
                           placeholder="城市" required>
                </div>
                <div class="form-group half">
                    <label for="district">区县 <span class="required">*</span></label>
                    <input type="text" id="district" name="district" class="form-control" 
                           placeholder="区县" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="detail">详细地址 <span class="required">*</span></label>
                <textarea id="detail" name="detail" class="form-control" rows="3" 
                          placeholder="街道、门牌号等信息" required></textarea>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">✅ 保存地址</button>
                <a href="{% url 'goods:address_list' %}" class="btn btn-secondary">↩️ 返回</a>
            </div>
        </form>
    </div>
</div>

<style>
    .address-form-container {
        max-width: 700px;
        margin: 40px auto;
        padding: 0 20px;
    }
    
    .form-card {
        background: white;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
        overflow: hidden;
    }
    
    .form-title {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 25px 30px;
        margin: 0;
        font-size: 24px;
        font-weight: 500;
    }
    
    .address-form {
        padding: 30px;
    }
    
    .form-group {
        margin-bottom: 20px;
    }
    
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
    }
    
    .required {
        color: #ff5722;
    }
    
    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.3s;
    }
    
    .form-control:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    
    textarea.form-control {
        resize: vertical;
    }
    
    .form-hint {
        display: block;
        margin-top: 5px;
        font-size: 12px;
        color: #999;
    }
    
    .form-row {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
    }
    
    .form-group.half {
        flex: 1;
        min-width: 120px;
    }
    
    .form-actions {
        display: flex;
        gap: 15px;
        margin-top: 30px;
    }
    
    .btn {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        transition: all 0.3s;
    }
    
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }
    
    .btn-secondary {
        background: #f5f5f5;
        color: #666;
    }
    
    .btn-secondary:hover {
        background: #e0e0e0;
    }
    
    @media (max-width: 600px) {
        .form-row {
            flex-direction: column;
            gap: 0;
        }
        .address-form {
            padding: 20px;
        }
    }
</style>
{% endblock %}
