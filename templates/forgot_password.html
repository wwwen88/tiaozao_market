{% extends 'base.html' %}
{% load static %}

{% block title %}忘记密码 - 跳蚤市场{% endblock %}

{% block content %}
<div class="forgot-container">
    <div class="forgot-card">
        <h2 class="forgot-title">🔐 忘记密码</h2>
        <p class="forgot-desc">输入您的注册邮箱，我们将为您重置密码</p>
        
        {% if messages %}
            {% for message in messages %}
                <div class="alert {% if message.tags == 'success' %}alert-success{% else %}alert-error{% endif %}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}
        
        <form method="post" class="forgot-form">
            {% csrf_token %}
            
            <div class="form-group">
                <label for="email">📧 注册邮箱</label>
                <input type="email" id="email" name="email" class="form-control" 
                       placeholder="请输入您的注册邮箱" required>
            </div>
            
            <div class="form-actions">
                <button type="submit" class="btn btn-primary">📧 重置密码</button>
            </div>
        </form>
        
        <div class="login-link">
            💡 想起密码了？<a href="{% url 'auth_app:login' %}">去登录</a>
        </div>
        
        <div class="register-link">
            还没有账号？<a href="{% url 'auth_app:register' %}">立即注册</a>
        </div>
    </div>
</div>

<style>
    .forgot-container {
        max-width: 450px;
        margin: 40px auto;
        padding: 0 20px;
    }
    .forgot-card {
        background: white;
        border-radius: 20px;
        padding: 35px;
        box-shadow: 0 10px 40px rgba(0,0,0,0.1);
    }
    .forgot-title {
        font-size: 26px;
        margin-bottom: 10px;
        text-align: center;
        color: #333;
    }
    .forgot-desc {
        text-align: center;
        color: #666;
        margin-bottom: 25px;
        font-size: 14px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 500;
        color: #333;
    }
    .form-control {
        width: 100%;
        padding: 12px 15px;
        border: 1px solid #ddd;
        border-radius: 10px;
        font-size: 14px;
        transition: all 0.3s;
    }
    .form-control:focus {
        border-color: #667eea;
        outline: none;
        box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
    }
    .alert {
        padding: 12px 15px;
        border-radius: 10px;
        margin-bottom: 20px;
        text-align: center;
        font-size: 14px;
    }
    .alert-success {
        background: #e8f5e9;
        color: #2e7d32;
        border-left: 4px solid #4caf50;
    }
    .alert-error {
        background: #ffebee;
        color: #c62828;
        border-left: 4px solid #f44336;
    }
    .btn {
        width: 100%;
        padding: 12px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        text-align: center;
        text-decoration: none;
        transition: all 0.3s;
    }
    .btn-primary {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
    }
    .btn-primary:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(102,126,234,0.4);
    }
    .login-link {
        text-align: center;
        margin-top: 20px;
        color: #666;
        font-size: 14px;
    }
    .login-link a {
        color: #667eea;
        text-decoration: none;
    }
    .login-link a:hover {
        text-decoration: underline;
    }
    .register-link {
        text-align: center;
        margin-top: 12px;
        color: #999;
        font-size: 14px;
    }
    .register-link a {
        color: #667eea;
        text-decoration: none;
    }
    .register-link a:hover {
        text-decoration: underline;
    }
    
    @media (max-width: 500px) {
        .forgot-card {
            padding: 25px;
        }
        .forgot-title {
            font-size: 22px;
        }
    }
</style>
{% endblock %}
