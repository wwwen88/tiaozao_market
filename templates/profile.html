<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人资料管理 - 跳蚤市场</title>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 30px;
        }
        .profile-card {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }
        .profile-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 30px;
            text-align: center;
            color: white;
        }
        .avatar-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            margin-bottom: 15px;
        }
        .profile-body {
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="profile-header">
            <img src="{{ profile.avatar.url }}" alt="头像" class="avatar-preview">
            <h3>{{ user.username }}</h3>
            <p class="mb-0">会员资料</p>
        </div>
        <div class="profile-body">
            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-success alert-dismissible fade show" role="alert">
                        {{ message }}
                        <button type="button" class="close" data-dismiss="alert">
                            <span>&times;</span>
                        </button>
                    </div>
                {% endfor %}
            {% endif %}

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="form-group">
                    <label>昵称</label>
                    {{ form.nickname }}
                    <small class="form-text text-muted">不超过20字，可选填</small>
                </div>

                <div class="form-group">
                    <label>更换头像</label>
                    {{ form.avatar }}
                    <small class="form-text text-muted">支持jpg、png格式</small>
                </div>

                <div class="form-group">
                    <label>手机号</label>
                    {{ form.phone }}
                    <small class="form-text text-muted">11位手机号，可选填</small>
                </div>

                <div class="form-group">
                    <label>邮箱</label>
                    {{ form.email }}
                    <small class="form-text text-muted">可选填，用于密码找回</small>
                </div>

                <div class="form-group">
                    <label>性别</label>
                    {{ form.gender }}
                </div>

                <button type="submit" class="btn btn-primary btn-block">保存修改</button>
                <a href="{% url 'goods:index' %}" class="btn btn-secondary btn-block mt-2">返回首页</a>
            </form>
        </div>
    </div>
<!-- 在保存修改按钮和返回首页按钮之间添加 -->
<div style="display:flex; gap:15px; margin-top:15px;">
    <a href="{% url 'auth_app:change_password' %}" style="flex:1; padding:10px; background:#f5f5f5; color:#333; text-align:center; border-radius:8px; text-decoration:none; border:1px solid #ddd;">
        🔑 修改密码
    </a>
</div>
    <script src="https://cdn.bootcdn.net/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/twitter-bootstrap/4.6.2/js/bootstrap.min.js"></script>
</body>
</html>
