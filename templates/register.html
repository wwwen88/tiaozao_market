<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>跳蚤市场 - 用户注册</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .register-container {
            background-color: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 500px;
        }
        .register-title {
            text-align: center;
            margin-bottom: 30px;
            color: #333;
            font-size: 28px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #666;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }
        .error-msg {
            text-align: center;
            color: #f56c6c;
            margin: 10px 0;
            font-size: 14px;
        }
        .success-msg {
            text-align: center;
            color: #67c23a;
            margin: 10px 0;
            font-size: 14px;
        }
        .submit-btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102,126,234,0.4);
        }
        .password-tip {
            font-size: 12px;
            color: #999;
            margin-top: 5px;
        }
        .login-link {
            margin-top: 20px;
            text-align: center;
        }
        .login-link a {
            color: #667eea;
            text-decoration: none;
        }
        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="register-container">
        <h2 class="register-title">📦 跳蚤市场注册</h2>
        <form action="{% url 'auth_app:register' %}" method="POST">
            {% csrf_token %}

            {% if state %}
                {% if '成功' in state %}
                <div class="success-msg">✓ {{ state }}</div>
                {% else %}
                <div class="error-msg">⚠ {{ state }}</div>
                {% endif %}
            {% endif %}

            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" id="username" name="username" required placeholder="请输入用户名（3-20位）">
            </div>

            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required placeholder="请输入密码（至少8位，含字母+数字）">
                <div class="password-tip">💡 密码要求：至少8位，包含字母和数字</div>
            </div>

            <div class="form-group">
                <label for="check_password">确认密码</label>
                <input type="password" id="check_password" name="check_password" required placeholder="请再次输入密码">
            </div>

            <div class="form-group">
                <label for="email">邮箱</label>
                <input type="email" id="email" name="email" required placeholder="请输入您的邮箱">
            </div>

            <div class="form-group">
                <label for="phone">手机号</label>
                <input type="tel" id="phone" name="phone" required placeholder="请输入11位手机号">
            </div>

            <button type="submit" class="submit-btn">立即注册</button>

            <div class="login-link">
                已有账号？<a href="{% url 'auth_app:login' %}">去登录</a>
            </div>
        </form>
    </div>
</body>
</html>
